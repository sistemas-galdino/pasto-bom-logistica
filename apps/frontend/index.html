<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C4416" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />

    <!-- App instalável na tela inicial (reunião de 16/07/2026). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- O iOS ignora o manifest: o ícone da tela inicial vem daqui, e tem que
         ser PNG opaco (SVG e transparência não funcionam no apple-touch-icon). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PB Logística" />

    <title>Pasto Bom — Logística</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Abertura: aparece já no primeiro paint, antes do React carregar, e é
         substituída quando ele monta no #root. Estilo inline porque o CSS do
         app ainda não chegou neste momento. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff">
        <img src="/logo-abertura.png" alt="Rede do Campo — Pasto Bom" style="width:min(53vw,282px);height:auto" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
